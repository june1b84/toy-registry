<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トイレジストリ - おもちゃ管理アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="dark-theme">
    <header>
        <div class="container">
            <h1>🧸 トイレジストリ</h1>
            <p class="subtitle">おもちゃの重複購入をスマートに防止</p>
        </div>
    </header>

    <main class="container">
        <!-- スキャナーセクション -->
        <section id="scan-section" class="card">
            <div class="card-header">
                <h2>📷 バーコードを読み取る</h2>
            </div>
            <div id="reader-container">
                <div id="reader"></div>
            </div>
            <div class="manual-input">
                <p>またはJANコードを手入力</p>
                <div class="input-group">
                    <input type="text" id="jan-input" placeholder="例: 4904810123456" maxlength="13">
                    <button id="manual-search-btn" class="btn-primary">検索</button>
                </div>
            </div>
        </section>

        <!-- スキャン結果パネル（ポップアップまたは展開） -->
        <section id="result-panel" class="card hidden">
            <div class="card-header">
                <h2>🔎 検索結果</h2>
                <button id="close-result" class="btn-icon">×</button>
            </div>
            <div class="result-content">
                <div class="product-info">
                    <div class="product-image-container">
                        <img id="product-image" src="" alt="商品画像" onerror="this.src='https://placehold.jp/24/333333/ffffff/200x200.png?text=No+Image'">
                    </div>
                    <div class="product-details">
                        <h3 id="product-name">商品名を取得中...</h3>
                        <p id="product-jan" class="jan-code"></p>
                    </div>
                </div>
                
                <div class="owner-status">
                    <h4>子供たちの所有状況</h4>
                    <div id="owner-table-container">
                        <!-- ここにJavaScriptでテーブルが描画される -->
                    </div>
                </div>
                <div class="result-actions">
                    <button id="add-toy-btn" class="btn-success">リストに保存</button>
                </div>
            </div>
        </section>

        <!-- おもちゃ一覧 -->
        <section id="list-section">
            <div class="list-header">
                <h2>📋 持っているおもちゃ一覧</h2>
                <div class="search-filter">
                    <input type="text" id="toy-search" placeholder="名前で検索...">
                </div>
            </div>
            <div id="toy-list" class="toy-grid">
                <!-- ここにJavaScriptでカードが描画される -->
            </div>
        </section>
    </main>

    <!-- 設定・管理メニュー -->
    <footer class="container">
        <div class="settings-actions">
            <button id="manage-children-btn" class="btn-secondary">👦 子供の管理</button>
            <button id="export-data-btn" class="btn-secondary">💾 データ保存</button>
            <button id="import-data-btn" class="btn-secondary">📥 データ読込</button>
            <input type="file" id="import-file" style="display: none;" accept=".json">
        </div>
        <p class="copyright">&copy; 2026 Toy Registry</p>
    </footer>

    <!-- モーダル: 子供管理 -->
    <div id="children-modal" class="modal hidden">
        <div class="modal-content card">
            <div class="card-header">
                <h2>👦 子供の管理</h2>
                <button id="close-modal" class="btn-icon">×</button>
            </div>
            <div id="children-list-container">
                <!-- 子供のリストがここに表示される -->
            </div>
            <div class="modal-actions">
                <div class="input-group">
                    <input type="text" id="new-child-name" placeholder="新しい子供の名前">
                    <button id="add-child-btn" class="btn-primary">追加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 通知 -->
    <div id="notification-container"></div>

    <script src="app.js"></script>
</body>
</html>
